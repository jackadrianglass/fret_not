[workspace]
resolver = "2"
members = [
    "crates/absolute",
    "crates/relative",
    "crates/fretboard",
    "crates/gui",
]

[workspace.dependencies]
absolute = { path = "crates/absolute" }
relative = { path = "crates/relative" }
fretboard = { path = "crates/fretboard" }
serde = { version = "1", features = ["derive"] }

[workspace.package]
edition = "2024"
